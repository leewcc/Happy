<!DOCTYPE html>
<html>
<head>
    <title>选股器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='xuangu.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- 添加 ECharts 库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>选股器</h1>
            <p class="subtitle">快速筛选，精准选股</p>
        </div>

        <div class="filter-panel">
            <!-- 日期选择 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">📅</span>
                    <label>交易日期</label>
                </div>
                <input type="date" id="trade_date" class="date-input">
            </div>

            <!-- 行业选择 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">🏢</span>
                    <label>行业</label>
                </div>
                <input type="text" id="industry" placeholder="请输入行业名称">
            </div>

            <!-- 概念选择 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">💡</span>
                    <label>概念</label>
                </div>
                <div class="concept-inputs">
                    <div class="concept-input-group">
                        <input type="text" class="concept-input" placeholder="请输入概念">
                        <button class="add-concept" onclick="addConceptInput()">
                            <span class="button-icon">+</span>
                        </button>
                    </div>
                    <div id="more-concepts"></div>
                </div>
            </div>

            <!-- 成交额筛选 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">💰</span>
                    <label>成交额</label>
                </div>
                <div class="turnover-inputs">
                    <div class="input-with-label">
                        <input type="number" id="turnover_days" placeholder="0" min="1">
                        <span class="unit">天</span>
                    </div>
                    <div class="input-with-label">
                        <input type="number" id="turnover_amount" placeholder="0">
                        <span class="unit">亿</span>
                    </div>
                </div>
            </div>

            <!-- 均线多头 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">📈</span>
                    <label>均线多头</label>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="ma_trend" class="toggle-input">
                    <label for="ma_trend" class="toggle-label"></label>
                </div>
            </div>

            <!-- 上影线 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">📊</span>
                    <label>上影线</label>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="upper_shadow" class="toggle-input">
                    <label for="upper_shadow" class="toggle-label"></label>
                </div>
            </div>

            <!-- 低吸战法 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">📉</span>
                    <label>低吸战法</label>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="dip_buy" class="toggle-input">
                    <label for="dip_buy" class="toggle-label"></label>
                </div>
            </div>

            <!-- 强势回调20日线 -->
            <div class="filter-item">
                <div class="filter-label">
                    <span class="icon">💪</span>
                    <label>强势回调20日线</label>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="strong_pullback_20" class="toggle-input">
                    <label for="strong_pullback_20" class="toggle-label"></label>
                </div>
            </div>

            <button class="search-button" onclick="filterStocks()">
                <span class="button-icon">🔍</span>
                开始筛选
            </button>
        </div>
        
        <div class="results-panel">
            <div class="results-header">
                <h2>筛选结果</h2>
                <span class="results-count" id="results-count">0 个结果</span>
            </div>
            <div class="table-container">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>股票名称</th>
                            <th>涨跌幅(%)</th>
                            <th>成交额(万)</th>
                            <th>总市值(亿)</th>
                            <th>所属行业</th>
                            <th>所属概念</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 添加悬浮 K 线图容器 -->
    <div id="klineTooltip" class="kline-tooltip">
        <div id="klineChart"></div>
    </div>

    <style>
        /* 修改 K 线图相关样式 */
        .kline-tooltip {
            display: none;
            position: absolute;  /* 改回 absolute */
            z-index: 9999;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 10px;
            pointer-events: auto;  /* 确保可以与悬浮框交互 */
        }

        #klineChart {
            width: 900px;
            height: 600px;
            background: white;  /* 添加白色背景 */
        }

        .stock-name {
            cursor: pointer;
            position: relative;  /* 添加相对定位 */
        }

        /* 添加一个清晰的悬浮效果 */
        .stock-name:hover {
            background-color: #f5f7fa;
        }

        .concept-stats {
            margin-top: 30px;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .concept-stats h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .concept-stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            max-height: 400px;  /* 限制最大高度 */
            overflow-y: auto;  /* 添加垂直滚动条 */
            display: block;  /* 使滚动条生效 */
        }

        .concept-stats-table thead {
            position: sticky;  /* 表头固定 */
            top: 0;
            background: white;
            z-index: 1;
        }

        .concept-stats-table thead tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .concept-stats-table tbody {
            display: block;
            overflow-y: auto;
            max-height: 350px;  /* 设置tbody的最大高度 */
        }

        .concept-stats-table tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .concept-stats-table th,
        .concept-stats-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            width: 33.33%;  /* 三列等宽 */
        }

        .concept-stats-table th {
            background-color: var(--input-background);
            font-weight: 500;
            color: #4a5568;
        }

        .concept-stats-table tr:hover {
            background-color: #f8fafd;
        }

        .concept-stats-table td:nth-child(2),
        .concept-stats-table td:nth-child(3) {
            text-align: right;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        /* 修改概念列的样式 */
        .concept-cell {
            max-width: 300px;  /* 设置最大宽度 */
            white-space: normal !important;  /* 允许文本换行 */
            word-wrap: break-word;  /* 允许长单词换行 */
            line-height: 1.4;  /* 增加行高 */
            padding: 8px 12px !important;  /* 增加内边距 */
        }

        /* 修改表格单元格的默认样式 */
        #results-table td {
            white-space: nowrap;  /* 其他列保持不换行 */
            padding: 8px 12px;
            vertical-align: top;  /* 顶部对齐，使多行文本看起来更整齐 */
        }

        /* 确保表格布局合理 */
        #results-table {
            table-layout: fixed;  /* 使用固定表格布局 */
            width: 100%;
        }

        /* 设置各列的宽度 */
        #results-table th:nth-child(1) { width: 12%; }  /* 股票名称 */
        #results-table th:nth-child(2) { width: 10%; }  /* 涨跌幅 */
        #results-table th:nth-child(3) { width: 12%; }  /* 成交额 */
        #results-table th:nth-child(4) { width: 12%; }  /* 总市值 */
        #results-table th:nth-child(5) { width: 14%; }  /* 所属行业 */
        #results-table th:nth-child(6) { width: 40%; }  /* 所属概念 */

        /* 添加日期选择器样式 */
        .date-input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-background);
            color: var(--text-color);
            font-size: 14px;
            width: 200px;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
        }
    </style>

    <script>
        // 添加一个变量存储最新交易日期
        let latest_date = '';

        function addConceptInput() {
            const container = document.getElementById('more-concepts');
            const div = document.createElement('div');
            div.className = 'concept-input-group';
            div.innerHTML = `
                <input type="text" class="concept-input" placeholder="输入概念">
                <button class="remove-concept" onclick="this.parentElement.remove()">-</button>
            `;
            container.appendChild(div);
        }

        function getAllConcepts() {
            const concepts = [];
            document.querySelectorAll('.concept-input').forEach(input => {
                if (input.value.trim()) {
                    concepts.push(input.value.trim());
                }
            });
            return concepts;
        }

        function updateResultsCount(count) {
            document.getElementById('results-count').textContent = `${count} 个结果`;
        }

        // 初始化K线图
        var klineChart = echarts.init(document.getElementById('klineChart'));
        var tooltipTimer = null;
        
        // 处理鼠标悬浮事件
        function handleStockHover(event, stockCode, stockName) {
            console.log('Hovering over:', stockCode, stockName, latest_date); // 调试日志
            clearTimeout(tooltipTimer);
            
            const tooltip = document.getElementById('klineTooltip');
            const chart = document.getElementById('klineChart');
            
            // 计算悬浮框位置
            const rect = event.target.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // 修改定位逻辑
            let left = rect.left;
            let top = rect.bottom + scrollTop;
            
            // 确保悬浮框不会超出屏幕
            if (left + tooltip.offsetWidth > window.innerWidth) {
                left = window.innerWidth - tooltip.offsetWidth - 20;
            }
            
            // 先设置显示，再设置位置
            tooltip.style.display = 'block';
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            
            console.log('Tooltip position:', { left, top, rect }); // 调试日志
            
            // 加载K线数据
            fetch(`/stock_kline/${stockCode}?date=${latest_date}`)
                .then(response => response.json())
                .then(result => {
                    console.log('K线数据:', result); // 调试日志
                    if (result.code === 0 && result.data && result.data.length > 0) {
                        const klineData = result.data;
                        
                        const option = {
                            title: {
                                text: `${stockName}(${stockCode}) K线图`,
                                left: 'center',
                                textStyle: {
                                    fontSize: 18  // 增大标题字号
                                }
                            },
                            tooltip: {
                                trigger: 'axis',
                                axisPointer: {
                                    type: 'cross'
                                },
                                textStyle: {
                                    fontSize: 14  // 增大提示框字号
                                }
                            },
                            legend: {
                                data: ['K线', 'MA5', 'MA10', 'MA20', 'MA60', 'BOLL上轨', 'BOLL中轨', 'BOLL下轨', '成交额'],
                                top: '30px',
                                textStyle: {
                                    fontSize: 14
                                }
                            },
                            grid: [{
                                left: '10%',
                                right: '10%',
                                height: '60%',  // K线图占据60%的高度
                                top: '5%'
                            }, {
                                left: '10%',
                                right: '10%',
                                height: '20%',  // 成交额图占据20%的高度
                                bottom: '5%'
                            }],
                            xAxis: [{
                                type: 'category',
                                data: klineData.map(item => item.trade_date),
                                scale: true,
                                gridIndex: 0,  // 对应第一个 grid
                                axisLabel: {
                                    fontSize: 12,
                                    rotate: 30
                                }
                            }, {
                                type: 'category',
                                gridIndex: 1,  // 对应第二个 grid
                                data: klineData.map(item => item.trade_date),
                                axisLabel: {show: false}  // 不显示第二个 x 轴的标签
                            }],
                            yAxis: [{
                                scale: true,
                                splitArea: {
                                    show: true
                                },
                                axisLabel: {
                                    fontSize: 12
                                },
                                gridIndex: 0  // 对应第一个 grid
                            }, {
                                scale: true,
                                gridIndex: 1,  // 对应第二个 grid
                                name: '成交额(亿)',
                                axisLabel: {
                                    formatter: function(value) {
                                        if (value >= 100) {
                                            return (value/100).toFixed(1) + '百';
                                        } else if (value >= 10) {
                                            return value.toFixed(1);
                                        } else {
                                            return value.toFixed(2);
                                        }
                                    }
                                }
                            }],
                            series: [
                                {
                                    name: 'K线',
                                    type: 'candlestick',
                                    data: klineData.map(item => [item.open, item.close, item.low, item.high]),
                                    xAxisIndex: 0,
                                    yAxisIndex: 0
                                },
                                {
                                    name: 'MA5',
                                    xAxisIndex: 0,
                                    yAxisIndex: 0,
                                    type: 'line',
                                    data: klineData.map(item => item.ma_5),
                                    smooth: true,
                                    showSymbol: false,
                                    lineStyle: {
                                        opacity: 0.6,
                                        color: '#000000',      // 黑色
                                        width: 1              // 设置线宽为1px
                                    }
                                },
                                {
                                    name: 'MA10',
                                    xAxisIndex: 0,
                                    yAxisIndex: 0,
                                    type: 'line',
                                    data: klineData.map(item => item.ma_10),
                                    smooth: true,
                                    showSymbol: false,
                                    lineStyle: {
                                        opacity: 0.6,
                                        color: '#800080',      // 紫色
                                        width: 1
                                    }
                                },
                                {
                                    name: 'MA20',
                                    xAxisIndex: 0,
                                    yAxisIndex: 0,
                                    type: 'line',
                                    data: klineData.map(item => item.ma_20),
                                    smooth: true,
                                    showSymbol: false,
                                    lineStyle: {
                                        opacity: 0.6,
                                        color: '#FFD700',      // 黄色
                                        width: 1
                                    }
                                },
                                {
                                    name: 'MA60',
                                    xAxisIndex: 0,
                                    yAxisIndex: 0,
                                    type: 'line',
                                    data: klineData.map(item => item.ma_60),
                                    smooth: true,
                                    showSymbol: false,
                                    lineStyle: {
                                        opacity: 0.6,
                                        color: '#FF0000',      // 红色
                                        width: 1
                                    }
                                },
                                {
                                    name: 'BOLL上轨',
                                    xAxisIndex: 0,
                                    yAxisIndex: 0,
                                    type: 'line',
                                    data: klineData.map(item => item.boll_up),
                                    smooth: true,
                                    showSymbol: false,
                                    lineStyle: {
                                        opacity: 0.6,
                                        color: '#FF0000',     // 红色
                                        width: 1,
                                        type: 'solid'
                                    }
                                },
                                {
                                    name: 'BOLL中轨',
                                    xAxisIndex: 0,
                                    yAxisIndex: 0,
                                    type: 'line',
                                    data: klineData.map(item => item.boll_mid),
                                    smooth: true,
                                    showSymbol: false,
                                    lineStyle: {
                                        opacity: 0.6,
                                        color: '#800080',     // 紫色
                                        width: 1,
                                        type: 'solid'
                                    }
                                },
                                {
                                    name: 'BOLL下轨',
                                    xAxisIndex: 0,
                                    yAxisIndex: 0,
                                    type: 'line',
                                    data: klineData.map(item => item.boll_low),
                                    smooth: true,
                                    showSymbol: false,
                                    lineStyle: {
                                        opacity: 0.6,
                                        color: '#00FF00',     // 绿色
                                        width: 1,
                                        type: 'solid'
                                    }
                                },
                                {
                                    name: '成交额',
                                    xAxisIndex: 1,
                                    yAxisIndex: 1,
                                    type: 'bar',
                                    data: klineData.map(item => item.amount),
                                    itemStyle: {
                                        color: function(params) {
                                            const k = klineData[params.dataIndex];
                                            return k.close >= k.open ? '#f56c6c' : '#67c23a';  // 收盘价>=开盘价用红色，否则用绿色
                                        }
                                    },
                                    label: {
                                        show: false
                                    }
                                }
                            ]
                        };
                        
                        klineChart.setOption(option);
                        klineChart.resize();
                    }
                })
                .catch(error => {
                    console.error('获取K线数据失败:', error);
                });
        }

        // 处理鼠标离开事件
        function handleStockLeave() {
            tooltipTimer = setTimeout(() => {
                document.getElementById('klineTooltip').style.display = 'none';
            }, 100);
        }

        function filterStocks() {
            const tradeDate = document.getElementById('trade_date').value;
            
            // 更新URL，不刷新页面
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('date', tradeDate);
            window.history.pushState({}, '', newUrl);

            const filters = {
                trade_date: tradeDate,
                industry: document.getElementById('industry').value,
                concepts: getAllConcepts().join(','),
                turnover_days: document.getElementById('turnover_days').value,
                turnover_amount: document.getElementById('turnover_amount').value,
                ma_trend: document.getElementById('ma_trend').checked,
                dip_buy: document.getElementById('dip_buy').checked,
                upper_shadow: document.getElementById('upper_shadow').checked,
                strong_pullback_20: document.getElementById('strong_pullback_20').checked
            };

            axios.post('/api/stocks', filters)
                .then(response => {
                    const tbody = document.getElementById('results-body');
                    tbody.innerHTML = '';
                    
                    // 获取第一条记录的日期作为最新交易日期
                    if (response.data && response.data.length > 0) {
                        latest_date = formatDate(new Date(response.data[0].trade_date));
                    }
                    
                    // 先更新表格数据
                    response.data.forEach(stock => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="name-cell stock-name" data-code="${stock.stock_code}" data-name="${stock.stock_name}">${stock.stock_name}</td>
                            <td class="change-cell ${stock.change_rate >= 0 ? 'up' : 'down'}">${stock.change_rate}%</td>
                            <td class="number-cell">${formatNumber(stock.turnover)}</td>
                            <td class="number-cell">${formatNumber(stock.total_mv)}</td>
                            <td class="industry-cell">${stock.industry || '-'}</td>
                            <td class="concept-cell">${stock.concept || '-'}</td>
                        `;
                        tbody.appendChild(row);

                        // 为新添加的股票名称单元格添加悬浮事件
                        const nameCell = row.querySelector('.stock-name');
                        nameCell.addEventListener('mouseenter', (e) => {
                            handleStockHover(e, stock.stock_code, stock.stock_name);
                        });
                        nameCell.addEventListener('mouseleave', handleStockLeave);
                    });
                    
                    updateResultsCount(response.data.length);
                    
                    // 统计概念出现次数
                    const conceptStats = {};
                    response.data.forEach(stock => {
                        if (stock.concept) {
                            stock.concept.split(',').forEach(concept => {
                                concept = concept.trim();
                                if (concept && concept !== '-') {
                                    conceptStats[concept] = (conceptStats[concept] || 0) + 1;
                                }
                            });
                        }
                    });
                    
                    // 转换为数组并排序
                    const sortedConcepts = Object.entries(conceptStats)
                        .sort((a, b) => b[1] - a[1]);
                    
                    // 生成概念统计 HTML
                    const statsHtml = `
                        <div class="concept-stats">
                            <h3>热门概念统计（共 ${sortedConcepts.length} 个）</h3>
                            <table class="concept-stats-table">
                                <thead>
                                    <tr>
                                        <th>概念</th>
                                        <th>数量</th>
                                        <th>占比</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sortedConcepts.map(([concept, count]) => `
                                        <tr>
                                            <td>${concept}</td>
                                            <td>${count}</td>
                                            <td>${((count / response.data.length) * 100).toFixed(1)}%</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                    
                    // 先清除旧的概念统计
                    const resultsPanel = document.querySelector('.results-panel');
                    const existingStats = resultsPanel.querySelector('.concept-stats');
                    if (existingStats) {
                        existingStats.remove();
                    }
                    
                    // 在表格后面添加概念统计
                    const tableContainer = document.querySelector('.table-container');
                    tableContainer.insertAdjacentHTML('afterend', statsHtml);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // 防止鼠标移入悬浮框时关闭
        document.getElementById('klineTooltip').onmouseenter = () => {
            clearTimeout(tooltipTimer);
        };
        
        document.getElementById('klineTooltip').onmouseleave = handleStockLeave;

        function formatNumber(num) {
            return num ? num.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : '-';
        }

        // 修改日期格式化函数
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 在页面加载时获取最新交易日期并设置为默认值
        window.addEventListener('DOMContentLoaded', () => {
            // 从URL获取日期参数
            const urlParams = new URLSearchParams(window.location.search);
            const dateFromUrl = urlParams.get('date');
            
            if (dateFromUrl) {
                // 如果URL中有日期参数，直接使用
                document.getElementById('trade_date').value = dateFromUrl;
                // 自动触发筛选
                filterStocks();
            } else {
                // 如果URL中没有日期参数，获取最新交易日期
                axios.get('/api/latest_trade_date')
                    .then(response => {
                        if (response.data && response.data.latest_date) {
                            latest_date = response.data.latest_date;
                            document.getElementById('trade_date').value = latest_date;
                        }
                    })
                    .catch(error => {
                        console.error('获取最新交易日期失败:', error);
                    });
            }
        });
    </script>
</body>
</html>
