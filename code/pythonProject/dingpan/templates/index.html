<!DOCTYPE html>
<html>
<head>
    <title>实时盯盘系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kline.css') }}">
    <!-- 添加 Tabulator 样式 -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">实时盯盘</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-tab="rank">涨跌排行</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-tab="limit">涨停分析</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-tab="sector">板块地图</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- 涨跌排行页面 -->
        <div id="rank-page" class="page-content">
            <div class="market-overview-container">
                <!-- 左侧指数行情 -->
                <div class="indices-panel">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="index-list">
                                <div class="index-item">
                                    <span class="index-name">上证指数</span>
                                    <div id="sh-index" class="index-data">
                                        <span class="index-price"></span>
                                        <span class="index-change"></span>
                                    </div>
                                </div>
                                <div class="index-item">
                                    <span class="index-name">深证成指</span>
                                    <div id="sz-index" class="index-data">
                                        <span class="index-price"></span>
                                        <span class="index-change"></span>
                                    </div>
                                </div>
                                <div class="index-item">
                                    <span class="index-name">创业板指</span>
                                    <div id="cyb-index" class="index-data">
                                        <span class="index-price"></span>
                                        <span class="index-change"></span>
                                    </div>
                                </div>
                                <div class="index-item">
                                    <span class="index-name">科创50</span>
                                    <div id="kc-index" class="index-data">
                                        <span class="index-price"></span>
                                        <span class="index-change"></span>
                                    </div>
                                </div>
                                <div class="index-item">
                                    <span class="index-name">北证50</span>
                                    <div id="bj-index" class="index-data">
                                        <span class="index-price"></span>
                                        <span class="index-change"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧成交统计 -->
                <div class="amount-panel">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="amount-stat">
                                <div class="stat-label">总成交额</div>
                                <div id="total-amount" class="stat-value">0</div>
                            </div>
                            <div id="amount-trend"></div>
                        </div>
                    </div>
                </div>

                <!-- 右侧涨跌统计 -->
                <div class="stats-panel">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="market-stats">
                                <div class="stat-item">
                                    <div class="stat-label">上涨家数</div>
                                    <div id="up-count" class="stat-value up-color">0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">下跌家数</div>
                                    <div id="down-count" class="stat-value down-color">0</div>
                                </div>
                            </div>
                            <div id="distribution-chart"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 个股列表 -->
            <div class="row mt-3">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div id="stock-table"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 涨停分析页面 -->
        <div id="limit-page" class="page-content" style="display: none;">
            <!-- 涨停统计卡片 -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="limit-stats-container">
                                <div class="stat-item">
                                    <div class="stat-label">涨停家数</div>
                                    <div class="stat-value-container">
                                        <div id="limit-up-count" class="stat-value">0</div>
                                        <div id="last-limit-up-count" class="stat-last-value">昨日: 0</div>
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">创业板涨停</div>
                                    <div class="stat-value-container">
                                        <div id="gem-limit-up-count" class="stat-value">0</div>
                                        <div id="last-gem-limit-up-count" class="stat-last-value">昨日: 0</div>
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">炸板家数</div>
                                    <div class="stat-value-container">
                                        <div id="broken-limit-count" class="stat-value">0</div>
                                        <div id="last-broken-count" class="stat-last-value">昨日: 0</div>
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">跌停家数</div>
                                    <div class="stat-value-container">
                                        <div id="limit-down-count" class="stat-value">0</div>
                                        <div id="last-limit-down-count" class="stat-last-value">昨日: 0</div>
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">连板家数</div>
                                    <div class="stat-value-container">
                                        <div id="continuous-limit-count" class="stat-value">0</div>
                                        <div id="last-consecutive-count" class="stat-last-value">昨日: 0</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主要内容区域 -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">涨停股票</h5>
                                <div>
                                    <button class="btn btn-outline-primary btn-sm me-2" id="toggle-concept-stats">
                                        <i class="fas fa-chart-bar"></i> 概念统计
                                    </button>
                                    <div class="stock-type-filter d-inline-block">
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="filter-limit-up" checked>
                                            <label class="form-check-label" for="filter-limit-up">涨停</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="filter-broken">
                                            <label class="form-check-label" for="filter-broken">炸板</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="filter-continuous">
                                            <label class="form-check-label" for="filter-continuous">连板</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="filter-limit-down">
                                            <label class="form-check-label" for="filter-limit-down">跌停</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-body position-relative">
                            <div id="limit-stocks-table"></div>
                            <div class="tabulator-footer-records">共 <span id="total-records">0</span> 条记录</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 概念统计侧边栏 -->
        <div id="concept-stats-sidebar" class="sidebar">
            <div class="sidebar-header">
                <h5 class="mb-0">概念统计</h5>
                <div>
                    <span class="shortcut-tip">(Alt+D)</span>
                    <button type="button" class="btn-close" id="close-concept-stats"></button>
                </div>
            </div>
            <div class="sidebar-content">
                <div id="concept-stats-table"></div>
            </div>
        </div>

        <!-- 板块地图页面 -->
        <div id="sector-page" class="page-content" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">板块热力图</h5>
                    <div id="sector-heatmap"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="kline-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">K线图</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="kline-chart" style="height: 600px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加详细信息弹出框 -->
    <div class="modal fade" id="concept-detail-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">概念详细信息</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="concept-detail-content">
                        <div class="detail-row">
                            <span class="detail-label">涨停股票：</span>
                            <div id="concept-limit-ups" class="detail-value"></div>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">连板股票：</span>
                            <div id="concept-continuous" class="detail-value"></div>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">炸板股票：</span>
                            <div id="concept-broken" class="detail-value"></div>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">跌停股票：</span>
                            <div id="concept-limit-downs" class="detail-value"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 引用，注意顺序 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 添加 Tabulator -->
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    
    <!-- 先加载功能模块的 JS -->
    <script src="{{ url_for('static', filename='js/limit_analysis.js') }}"></script>
    <script src="{{ url_for('static', filename='js/kline.js') }}"></script>
    <!-- 最后加载主 JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
