<!DOCTYPE html>
<html>
<head>
    <title>股票分析系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .nav {
            background-color: #333;
            overflow: hidden;
            position: fixed;
            top: 0;
            width: 100%;
        }
        .nav a {
            float: left;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .nav a:hover {
            background-color: #ddd;
            color: black;
        }
        .nav a.active {
            background-color: #4CAF50;
            color: white;
        }
        .content {
            margin-top: 50px;
            padding: 20px;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="#" onclick="loadPage('/limit_stocks')" id="limitStocksLink">涨跌停分析</a>
        <a href="#" onclick="loadPage('/fupan')" id="fupanLink">复盘数据</a>
    </div>
    <div class="content">
        <iframe id="contentFrame" src="/limit_stocks"></iframe>
    </div>

    <script>
        function loadPage(url) {
            document.getElementById('contentFrame').src = url;
            
            // 更新导航栏活动状态
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            if (url === '/limit_stocks') {
                document.getElementById('limitStocksLink').classList.add('active');
            } else if (url === '/fupan') {
                document.getElementById('fupanLink').classList.add('active');
            }
        }

        // 初始化时设置涨跌停分析为活动状态
        document.getElementById('limitStocksLink').classList.add('active');
    </script>
</body>
</html>
