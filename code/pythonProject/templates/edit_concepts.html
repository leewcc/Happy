<!DOCTYPE html>
<html>
<head>
    <title>编辑核心概念</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .filter-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        
        .stock-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .stock-table th, .stock-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .stock-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        
        .stock-table tr:hover {
            background-color: #f5f7fa;
        }
        
        .concept-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .action-buttons {
            margin-top: 20px;
            text-align: right;
        }
        
        .save-btn {
            padding: 10px 20px;
            background-color: #409EFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .save-btn:hover {
            background-color: #66b1ff;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        
        .success {
            background-color: #f0f9eb;
            color: #67c23a;
            border: 1px solid #e1f3d8;
        }
        
        .error {
            background-color: #fef0f0;
            color: #f56c6c;
            border: 1px solid #fde2e2;
        }
        
        .limit-up { color: #f56c6c; }
        .limit-down { color: #67c23a; }
        .limit-break { color: #e6a23c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>编辑核心概念</h1>
        
        <div class="filter-section">
            <form id="dateForm" method="get" action="/edit_concepts">
                <label for="today">日期:</label>
                <input type="date" id="today" name="today" value="{{ today }}" required>
                <button type="submit">查询</button>
            </form>
        </div>
        
        <table class="stock-table">
            <thead>
                <tr>
                    <th>股票代码</th>
                    <th>股票名称</th>
                    <th>涨跌停类型</th>
                    <th>所属行业</th>
                    <th>核心概念</th>
                </tr>
            </thead>
            <tbody>
                {% for stock in stocks %}
                <tr>
                    <td>{{ stock.ts_code }}</td>
                    <td>
                        <span class="{% if stock.limit_type == 'U' %}limit-up{% elif stock.limit_type == 'D' %}limit-down{% elif stock.limit_type == 'Z' %}limit-break{% endif %}">
                            {{ stock.stock_name }}
                        </span>
                    </td>
                    <td>
                        {% if stock.limit_type == 'U' %}
                            <span class="limit-up">涨停</span>
                        {% elif stock.limit_type == 'D' %}
                            <span class="limit-down">跌停</span>
                        {% elif stock.limit_type == 'Z' %}
                            <span class="limit-break">炸板</span>
                        {% endif %}
                    </td>
                    <td>{{ stock.industry }}</td>
                    <td>
                        <input type="text" class="concept-input" 
                               data-ts-code="{{ stock.ts_code }}" 
                               data-stock-name="{{ stock.stock_name }}"
                               value="{{ stock.core_concept }}">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <div class="action-buttons">
            <button id="saveBtn" class="save-btn">保存核心概念</button>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
    </div>
    
    <script>
        $(document).ready(function() {
            // 日期输入框格式转换
            const today = "{{ today }}";
            if (today) {
                const formattedDate = today.substring(0, 4) + '-' + 
                                     today.substring(4, 6) + '-' + 
                                     today.substring(6, 8);
                $('#today').val(formattedDate);
            }
            
            // 保存按钮点击事件
            $('#saveBtn').click(function() {
                const concepts = [];
                
                // 收集所有概念输入
                $('.concept-input').each(function() {
                    const input = $(this);
                    const value = input.val().trim();
                    
                    if (value) {
                        concepts.push({
                            ts_code: input.data('ts-code'),
                            name: input.data('stock-name'),
                            core_concepts: value
                        });
                    }
                });
                
                // 发送保存请求
                $.ajax({
                    url: '/save_concepts',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ concepts: concepts }),
                    success: function(response) {
                        if (response.success) {
                            showStatus(response.message, 'success');
                        } else {
                            showStatus(response.message, 'error');
                        }
                    },
                    error: function() {
                        showStatus('保存失败，请稍后重试', 'error');
                    }
                });
            });
            
            // 显示状态消息
            function showStatus(message, type) {
                const statusDiv = $('#statusMessage');
                statusDiv.text(message);
                statusDiv.removeClass('success error');
                statusDiv.addClass(type);
                statusDiv.show();
                
                // 3秒后隐藏
                setTimeout(function() {
                    statusDiv.fadeOut();
                }, 3000);
            }
        });
    </script>
</body>
</html>
